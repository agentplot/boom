$schema: 'https://moonrepo.dev/schemas/project.json'

# The binary, boom. Each check is one task, in the fast layer
# (core.7).
language: 'rust'
layer: 'application'

tasks:
  format:
    command: 'cargo fmt --check -p boom'
    inputs: ['/crates/boom/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  lint:
    command: 'cargo clippy -p boom --all-targets --all-features -- -D warnings'
    inputs: ['/crates/boom/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  typecheck:
    command: 'cargo check -p boom --all-targets --all-features'
    inputs: ['/crates/boom/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  test:
    command: 'cargo test -p boom'
    inputs: ['/crates/boom/**/*', '/Cargo.toml', '/Cargo.lock', '/devenv.nix', '/devenv.lock', '/.prototools', '/rust-toolchain.toml']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
