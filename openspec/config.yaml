schema: spec-driven

context: |
  boom is a ledger of what a project has claimed about itself, one
  binary in Rust named `boom`: claims (invariants, decisions,
  assumptions), the narratives, contexts, relationships and terms around
  them, and the events that propose, accept, reject or supersede them,
  status read from the events. Every view, a scope's rules, decision
  records, a design book, a context map, is computed, never stored, and
  `boom check` reads the work against the claims that hold.

  Rules: docs/architecture/core.md binds every change, with the
  decisions behind it in docs/adr/, one MADR record each (adrs.toml).

  Stack: devenv for the shell, moon (through proto) for the checks,
  treefmt for formatting. Every tool runs through the shell, one command
  at a time: devenv shell -- <command>. Each check is a moon task tagged
  with its layer; every crate is a moon project of its own in
  .moon/workspace.yml (core.5), and every tool a task runs is the version
  the tree pins (core.6). sluice gates every merge onto main on the
  layers .config/sluice.toml requires.

  Commits: stage by pathspec and commit the paths you wrote, git add
  <paths>, then git commit -m "<subject>" -- <paths>; never -a, never
  add .. Conventional Commits subjects, scoped to the part of the tree
  touched.

rules:
  specs:
    - "A spec changes only through a delta in the change that builds it, and each scenario is one a moon task proves. A scenario no existing check proves is a check this change adds, in its tasks; never a step done by hand."
  design:
    - "Cite by id the rules in docs/architecture/ that this design relies on. Where the design departs from a rule, name the rule and say why."
    - "Where the design reaches the control plane, it goes through the one control-plane interface and names the implementation that serves it (core.2)."
  tasks:
    - "Each task says what must be true and names the moon task that proves it, run as `devenv shell -- moon run <project>:<task>`. No task is a step done by hand, a deploy or work after the landing."
    - "A task that adds a crate adds it to the cargo workspace's `members` and as a moon project of its own in .moon/workspace.yml, with its language declared and check-fast tasks for format, lint, type check and test, one task per check, each declaring its inputs, /devenv.nix, /devenv.lock and /.prototools among them (core.5)."
    - "A task that adds a tool pins its version in devenv.nix or .prototools, never a range, and runs it from there in every task (core.6)."
    - "A task that adds a file type has treefmt.nix claim it with a formatter or name it in an exclude, with its reason, in the same task (core.5)."
    - "The last task runs the checks of the moon projects the change touches, never the whole workspace, which sluice runs at the merge."

operations:
  apply:
    guidance:
      - "Tick a task only once the check it names passes, run as the task names it."
      - "Where a task leaves a detail open, decide it the way a careful engineer would from docs/architecture, openspec/specs, CLAUDE.md and the code, in that order, and name each choice in your summary. An open detail is not a reason to pause."
      - "Pause only when the same check still fails after two attempts, or when passing would mean changing a rule in docs/architecture or a spec under openspec/specs that the task does not tell you to change."
